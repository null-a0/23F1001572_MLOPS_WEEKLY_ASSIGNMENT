name: MLOps CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Authentication step for GCP will be added later
      # after we configure GitHub Secrets.

      - name: Pull DVC Artifacts
        run: |
          dvc pull

      - name: Run Pytest
        run: |
          pytest -v
